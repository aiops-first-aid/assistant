[project]
name = "assistant"
version = "0.1.0"
description = "aiops-first-aid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
assistant = "assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
